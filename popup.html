<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Summari</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="logo">
      <svg class="logo-icon" width="22" height="22" viewBox="0 0 22 22" fill="none">
        <rect x="1" y="1" width="20" height="20" rx="5" fill="#F59E0B" />
        <path d="M6 7h10M6 11h7M6 15h9" stroke="#0F0F0F" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <span class="logo-text">Summari</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btn-theme" title="Toggle light/dark mode" aria-label="Toggle theme">
        <!-- Moon icon (shown in light mode) -->
        <svg id="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" style="display:none">
          <path d="M13.5 10.5A6 6 0 0 1 5.5 2.5a6 6 0 1 0 8 8z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- Sun icon (shown in dark mode) -->
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 1v2M8 13v2M1 8h2M13 8h2M3.05 3.05l1.41 1.41M11.54 11.54l1.41 1.41M3.05 12.95l1.41-1.41M11.54 4.46l1.41-1.41" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Open settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6.5 1.5h3l.5 1.8a5 5 0 0 1 1.2.7l1.8-.6 1.5 2.6-1.4 1.2a5 5 0 0 1 0 1.6l1.4 1.2-1.5 2.6-1.8-.6a5 5 0 0 1-1.2.7l-.5 1.8h-3l-.5-1.8a5 5 0 0 1-1.2-.7l-1.8.6L1.5 10l1.4-1.2a5 5 0 0 1 0-1.6L1.5 6l1.5-2.6 1.8.6a5 5 0 0 1 1.2-.7l.5-1.8z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
          <circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ── Main View ── -->
  <div class="view" id="view-main">

    <!-- Page Info -->
    <div class="page-info" id="page-info">
      <div class="page-favicon" id="page-favicon">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <rect x="1" y="1" width="12" height="12" rx="2" stroke="currentColor" stroke-width="1.2"/>
          <path d="M4 7h6M4 4.5h3.5M4 9.5h4.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="page-meta">
        <div class="page-title" id="page-title">Loading page...</div>
        <div class="page-domain" id="page-domain"></div>
      </div>
    </div>

    <!-- Style Selector -->
    <div class="style-selector">
      <span class="style-label">Summary depth</span>
      <div class="style-pills">
        <button class="style-pill" data-style="brief" title="Summarize in 3 bullet points">Brief</button>
        <button class="style-pill active" data-style="standard" title="Summarize in 5 bullet points">Standard</button>
        <button class="style-pill" data-style="detailed" title="Summarize in 7 bullet points">Detailed</button>
      </div>
    </div>

    <!-- Action Bar -->
    <div class="action-bar">
      <button class="btn-primary" id="btn-summarize">
        <svg width="15" height="15" viewBox="0 0 15 15" fill="none">
          <path d="M7.5 1.5C4.19 1.5 1.5 4.19 1.5 7.5S4.19 13.5 7.5 13.5 13.5 10.81 13.5 7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M10.5 1.5l3 3-3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M13.5 4.5H9c-1.1 0-2 .9-2 2v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Summarize Page
      </button>
      <button class="btn-ghost" id="btn-clear" style="display:none" title="Clear summary">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M2 2l10 10M12 2L2 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Loading State -->
    <div class="loading-state" id="loading-state" style="display:none">
      <div class="spinner-wrap">
        <div class="spinner"></div>
      </div>
      <div class="loading-text" id="loading-text">Extracting content...</div>
      <div class="loading-bar"><div class="loading-bar-fill" id="loading-bar-fill"></div></div>
    </div>

    <!-- Error State -->
    <div class="error-state" id="error-state" style="display:none">
      <div class="error-icon">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <circle cx="10" cy="10" r="8.5" stroke="#EF4444" stroke-width="1.5"/>
          <path d="M10 6v5M10 13.5v.5" stroke="#EF4444" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="error-message" id="error-message">Something went wrong.</div>
      <button class="btn-ghost btn-retry" id="btn-retry">Try again</button>
    </div>

    <!-- Summary Output -->
    <div class="summary-wrap" id="summary-wrap" style="display:none">

      <!-- Cache badge -->
      <div class="cache-badge" id="cache-badge" style="display:none">
        <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <path d="M5 1.5A3.5 3.5 0 1 1 1.5 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M1.5 3V5H3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Cached result
      </div>

      <!-- Metadata strip -->
      <div class="summary-meta">
        <span class="meta-chip" id="meta-reading-time">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <circle cx="5.5" cy="5.5" r="4.5" stroke="currentColor" stroke-width="1.1"/>
            <path d="M5.5 3v2.5l1.5 1.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span></span>
        </span>
        <span class="meta-chip" id="meta-sentiment">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <path d="M2 3h7M2 5.5h5M2 8h6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
          <span></span>
        </span>
        <span class="meta-chip" id="meta-wordcount">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
            <path d="M1 3h9M1 5.5h6M1 8h7" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
          </svg>
          <span></span>
        </span>
      </div>

      <!-- Overview -->
      <section class="summary-section">
        <h3 class="section-label">Overview</h3>
        <p class="overview-text" id="overview-text"></p>
      </section>

      <!-- Key Points -->
      <section class="summary-section">
        <h3 class="section-label">Key Points</h3>
        <ul class="key-points" id="key-points"></ul>
      </section>

      <!-- Insights -->
      <section class="summary-section">
        <h3 class="section-label">Insights</h3>
        <ul class="insights-list" id="insights-list"></ul>
      </section>

      <!-- Tags -->
      <div class="tags-wrap" id="tags-wrap"></div>

      <!-- Footer Actions -->
      <div class="summary-actions">
        <button class="action-pill" id="btn-copy">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.2"/>
            <path d="M8 4V2.5A1.5 1.5 0 0 0 6.5 1h-4A1.5 1.5 0 0 0 1 2.5v4A1.5 1.5 0 0 0 2.5 8H4" stroke="currentColor" stroke-width="1.2"/>
          </svg>
          Copy
        </button>
        <button class="action-pill" id="btn-highlight-toggle">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2 9l2-2 5-5 1 1-5 5-2 2-1-1z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
            <path d="M9 2l1 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M2 10h8" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
          </svg>
          Highlight
        </button>
        <button class="action-pill" id="btn-refresh">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M10 6A4 4 0 1 1 6 2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            <path d="M6 1v3l2-1.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Refresh
        </button>
      </div>

    </div>
  </div>

  <!-- ── Settings View ── -->
  <div class="view" id="view-settings" style="display:none">
    <div class="settings-header">
      <button class="back-btn" id="btn-back">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
      <h2 class="settings-title">Settings</h2>
    </div>

    <div class="settings-body">
      <div class="settings-group">
        <label class="settings-label">AI Model</label>
        <div class="cache-info">
          <span class="cache-count">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none" style="display:inline;margin-right:4px">
              <circle cx="5" cy="5" r="4" fill="#10B981"/>
              <path d="M2.5 5l2 2 3-3" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Groq — Llama 3.3 70B — Connected
          </span>
        </div>
        <p class="settings-hint">Fast, free AI. No API key needed from you.</p>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
